services:
  puredown:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - ./downloads:/data/downloads
      # ---- B站 Cookie（国内 VPS 412 防盗链需要） ----
      # 1. 从浏览器导出 cookies.txt 放到项目目录
      # 2. 取消注释下面这行:
      # - ./cookies.txt:/data/cookies.txt:ro
    environment:
      - DOWNLOAD_DIR=/data/downloads
      # ---- B站 Cookie 文件路径 ----
      # 取消注释下面这行（对应上面的 volume 挂载）:
      # - COOKIES_FILE=/data/cookies.txt
    restart: unless-stopped
